<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 360px;
      padding: 40px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 48px;
      height: auto;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #111;
      margin-bottom: 6px;
      text-align: center;
    }

    .title {
      font-size: 14px;
      color: #777;
      text-align: center;
      margin-bottom: 36px;
    }

    .title strong {
      display: block;
      font-size: 16px;
      font-weight: 700;
      color: #444;
      margin-bottom: 4px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      color: #111;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      padding: 11px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #4338ca; }

    #loginBtn { background: #f97316; }
    #loginBtn:hover { background: #ea6c0a; }

    #message,
    #forgotMessage {
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    #message.success,
    #forgotMessage.success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    #message.error,
    #forgotMessage.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .dashboard h2 {
      font-size: 22px;
      color: #065f46;
      margin-bottom: 10px;
    }

    .dashboard p { color: #444; font-size: 15px; }

    #logoutBtn {
      margin-top: 20px;
      background: #dc2626;
    }

    #logoutBtn:hover { background: #b91c1c; }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-bottom: 0;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .remember-me label {
      margin-bottom: 0;
      font-size: 14px;
      font-weight: 400;
      color: #555;
      cursor: pointer;
    }

    .forgot-password {
      text-align: right;
      margin-top: -12px;
      margin-bottom: 18px;
    }

    .forgot-password a {
      font-size: 13px;
      color: #4f46e5;
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    #forgotForm {
      display: none;
    }

    .back-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      color: #4f46e5;
      text-decoration: none;
      cursor: pointer;
    }

    .back-link:hover { text-decoration: underline; }

    .date-time {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      z-index: 1000;
      font-family: inherit;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="dateTime" class="date-time" aria-live="polite"></div>
  <div class="card">
    <!-- Login Form -->
    <div id="loginForm">
      <h1>Sign In</h1>
      <p class="title"><strong>Welcome to Demo</strong>Please enter your details</p>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" />

      <div class="forgot-password">
        <a href="#" onclick="showForgotForm(); return false;">Forgot password?</a>
      </div>

      <div class="remember-me">
        <input type="checkbox" id="rememberMe" name="rememberMe" />
        <label for="rememberMe">Remember me</label>
      </div>

      <button id="loginBtn" onclick="handleLogin()">Login</button>
      <div id="message"></div>
    </div>

    <!-- Forgot Password Form -->
    <div id="forgotForm">
      <h1>Reset Password</h1>
      <label for="resetUsername">Username</label>
      <input type="text" id="resetUsername" name="resetUsername" placeholder="Enter your username" autocomplete="off" />
      <button onclick="handleForgotPassword()">Send Reset Link</button>
      <div id="forgotMessage"></div>
      <a class="back-link" onclick="showLoginForm()">← Back to Sign In</a>
    </div>

    <!-- Dashboard shown after successful login -->
    <div id="dashboard" class="dashboard">
      <h2>Login Successful!</h2>
      <p>Welcome, <strong id="welcomeUser"></strong></p>
      <button id="logoutBtn" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <script>
    // Valid credentials for testing
    const USERS = {
      admin: "password123",
      user: "test1234",
    };

    // Restore remembered username on page load
    window.addEventListener("load", function () {
      const saved = localStorage.getItem("rememberedUsername");
      if (saved) {
        document.getElementById("username").value = saved;
        document.getElementById("rememberMe").checked = true;
      }
    });

    function handleLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const rememberMe = document.getElementById("rememberMe").checked;
      const msg = document.getElementById("message");

      if (!username || !password) {
        showMessage("Please enter both username and password.", "error");
        return;
      }

      if (rememberMe) {
        localStorage.setItem("rememberedUsername", username);
      } else {
        localStorage.removeItem("rememberedUsername");
      }

      if (USERS[username] && USERS[username] === password) {
        msg.style.display = "none";
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("welcomeUser").textContent = username;
        document.getElementById("dashboard").style.display = "block";
      } else {
        showMessage("Invalid username or password.", "error");
      }
    }

    function handleLogout() {
      document.getElementById("password").value = "";
      if (!localStorage.getItem("rememberedUsername")) {
        document.getElementById("username").value = "";
      }
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
      showMessage("You have been logged out.", "success");
    }

    function showForgotForm() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("forgotForm").style.display = "block";
      document.getElementById("resetUsername").value = "";
      document.getElementById("forgotMessage").style.display = "none";
    }

    function showLoginForm() {
      document.getElementById("forgotForm").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
    }

    function handleForgotPassword() {
      const username = document.getElementById("resetUsername").value.trim();
      const msg = document.getElementById("forgotMessage");

      if (!username) {
        msg.textContent = "Please enter your username.";
        msg.className = "error";
        msg.style.display = "block";
        return;
      }

      if (USERS[username]) {
        msg.textContent = "A password reset link has been sent to your email.";
        msg.className = "success";
      } else {
        msg.textContent = "No account found with that username.";
        msg.className = "error";
      }
      msg.style.display = "block";
    }

    function showMessage(text, type) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = type;
      msg.style.display = "block";
    }

    function updateDateTime() {
      const now = new Date();
      document.getElementById("dateTime").textContent = now.toLocaleString([], {
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);

    // Allow Enter key to submit
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
