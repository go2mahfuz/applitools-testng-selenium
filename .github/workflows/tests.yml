name: Selenium + Applitools Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
  HAS_APPLITOOLS_READ_KEY: ${{ secrets.APPLITOOLS_READ_KEY != '' }}
  HAS_APPLITOOLS_WRITE_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY != '' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run tests
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
        run: |
          mvn test -Dsurefire.suiteXmlFiles=src/test/resources/testng-ci.xml

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Install Claude Code CLI
        if: always() && hashFiles('target/eyes-batch-url.txt') != '' && env.HAS_ANTHROPIC_KEY == 'true' && (env.HAS_APPLITOOLS_WRITE_KEY == 'true' || env.HAS_APPLITOOLS_READ_KEY == 'true')
        run: npm install -g @anthropic-ai/claude-code

      # Write key: add regions, accept expected diffs, reject bugs.
      # Never save — pending decisions stay undoable until someone saves
      # in Eyes or a gated workflow calls eyes_resolve_save.
      - name: Resolve Eyes batch (write mode)
        if: always() && hashFiles('target/eyes-batch-url.txt') != '' && env.HAS_ANTHROPIC_KEY == 'true' && env.HAS_APPLITOOLS_WRITE_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_WRITE_KEY }}
        run: |
          BATCH_URL=$(cat target/eyes-batch-url.txt)

          claude -p "Use the applitools-mcp tools to resolve the Applitools Eyes batch at \"$BATCH_URL\" (scope batch).

          Add match regions where appropriate, accept expected diffs, and reject visual bugs.

          Never call eyes_resolve_save. Leave decisions pending.

          Write a concise GitHub-flavored markdown summary to eyes-review-summary.md covering: total sessions, how many passed, how many are new baselines, how many are mismatching/unresolved (list their test names), and what regions/accept/reject decisions you made. End the summary with exactly one line: either \"STATUS: OK\" or \"STATUS: NEEDS_REVIEW\"." \
            --mcp-config .github/mcp/applitools-mcp.ci.json \
            --allowedTools "mcp__applitools-mcp__eyes_review_progress mcp__applitools-mcp__eyes_review_end mcp__applitools-mcp__eyes_inspect_sessions mcp__applitools-mcp__eyes_inspect_steps mcp__applitools-mcp__eyes_inspect_regions mcp__applitools-mcp__eyes_inspect_changed_areas mcp__applitools-mcp__eyes_inspect_dom mcp__applitools-mcp__eyes_inspect_dom_diff mcp__applitools-mcp__eyes_inspect_dom_search mcp__applitools-mcp__eyes_inspect_history mcp__applitools-mcp__eyes_inspect_image mcp__applitools-mcp__eyes_inspect_image_diff mcp__applitools-mcp__eyes_review_diff_report mcp__applitools-mcp__eyes_resolve_regions mcp__applitools-mcp__eyes_resolve_checkpoint mcp__applitools-mcp__eyes_fetch_visual_results mcp__applitools-mcp__eyes_verify_api_key" \
            > eyes-review-summary.md

          cat eyes-review-summary.md

      # Read-only fallback when write key is missing.
      - name: Inspect Eyes batch (read-only)
        if: always() && hashFiles('target/eyes-batch-url.txt') != '' && env.HAS_ANTHROPIC_KEY == 'true' && env.HAS_APPLITOOLS_WRITE_KEY != 'true' && env.HAS_APPLITOOLS_READ_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_READ_KEY }}
        run: |
          BATCH_URL=$(cat target/eyes-batch-url.txt)

          claude -p "Use the applitools-mcp tool eyes_review_progress with scope \"batch\" and batchUrl \"$BATCH_URL\" to inspect this CI run's Eyes batch.

          Read-only: never resolve, never accept, never reject, never add or change match regions, never save.

          Write a concise GitHub-flavored markdown summary to eyes-review-summary.md covering: total sessions, how many passed, how many are new baselines, and how many are mismatching/unresolved (list their test names). End the summary with exactly one line: either \"STATUS: OK\" or \"STATUS: NEEDS_REVIEW\"." \
            --mcp-config .github/mcp/applitools-mcp.ci.json \
            --allowedTools "mcp__applitools-mcp__eyes_review_progress mcp__applitools-mcp__eyes_review_end mcp__applitools-mcp__eyes_inspect_sessions mcp__applitools-mcp__eyes_inspect_steps mcp__applitools-mcp__eyes_inspect_regions mcp__applitools-mcp__eyes_inspect_changed_areas mcp__applitools-mcp__eyes_inspect_dom mcp__applitools-mcp__eyes_inspect_dom_diff mcp__applitools-mcp__eyes_inspect_dom_search mcp__applitools-mcp__eyes_inspect_history mcp__applitools-mcp__eyes_inspect_image mcp__applitools-mcp__eyes_inspect_image_diff mcp__applitools-mcp__eyes_review_diff_report mcp__applitools-mcp__eyes_fetch_visual_results mcp__applitools-mcp__eyes_verify_api_key" \
            > eyes-review-summary.md

          cat eyes-review-summary.md

      - name: Comment that Eyes review was skipped
        if: always() && github.event_name == 'pull_request' && hashFiles('target/eyes-batch-url.txt') != '' && (env.HAS_ANTHROPIC_KEY != 'true' || (env.HAS_APPLITOOLS_WRITE_KEY != 'true' && env.HAS_APPLITOOLS_READ_KEY != 'true'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<'EOF'
          ## Eyes review skipped

          Visual checkpoints ran, but AI review did not run.

          Add these GitHub Actions secrets, then re-run:
          - `ANTHROPIC_API_KEY` — for the `claude` CLI that drives the review.
          - `APPLITOOLS_WRITE_KEY` — Applitools key with **write** permission (regions, accept/reject). CI still does not save.
          - `APPLITOOLS_READ_KEY` — fallback for inspect-only review if a write key is not set. The capture secret `APPLITOOLS_API_KEY` is execute-only and cannot review results.
          EOF
          )"

      - name: Upload Eyes review report
        if: always() && hashFiles('eyes-review-summary.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: eyes-review-report
          path: eyes-review-summary.md

      - name: Post visual review comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('eyes-review-summary.md') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Eyes review report"
            echo
            if [ "${HAS_APPLITOOLS_WRITE_KEY}" = "true" ]; then
              echo "Resolve mode. Regions / accept / reject are **pending** and were **not** saved to the baseline."
            else
              echo "Read-only inspect. Nothing was accepted, rejected, or saved."
            fi
            echo
            cat eyes-review-summary.md
          } > pr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-comment.md
