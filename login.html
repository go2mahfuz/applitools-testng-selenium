<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 360px;
      padding: 40px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #111;
      margin-bottom: 28px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      color: #111;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #4f46e5;
    }

    button {
      width: 100%;
      padding: 11px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #4338ca; }

    #message {
      margin-top: 18px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    #message.success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    #message.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .dashboard h2 {
      font-size: 22px;
      color: #065f46;
      margin-bottom: 10px;
    }

    .dashboard p { color: #444; font-size: 15px; }

    #logoutBtn {
      margin-top: 20px;
      background: #dc2626;
    }

    #logoutBtn:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Login Form -->
    <div id="loginForm">
      <h1>Sign In</h1>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" />

      <button id="loginBtn" onclick="handleLogin()">Login</button>
      <div id="message"></div>
    </div>

    <!-- Dashboard shown after successful login -->
    <div id="dashboard" class="dashboard">
      <h2>Login Successful!</h2>
      <p>Welcome, <strong id="welcomeUser"></strong></p>
      <button id="logoutBtn" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <script>
    // Valid credentials for testing
    const USERS = {
      admin: "password123",
      user: "test1234",
    };

    function handleLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("message");

      if (!username || !password) {
        showMessage("Please enter both username and password.", "error");
        return;
      }

      if (USERS[username] && USERS[username] === password) {
        msg.style.display = "none";
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("welcomeUser").textContent = username;
        document.getElementById("dashboard").style.display = "block";
      } else {
        showMessage("Invalid username or password.", "error");
      }
    }

    function handleLogout() {
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
      showMessage("You have been logged out.", "success");
    }

    function showMessage(text, type) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = type;
      msg.style.display = "block";
    }

    // Allow Enter key to submit
    document.addEventListener("keydown", function (e) {
      if (e.key === "Enter") handleLogin();
    });
  </script>
</body>
</html>
